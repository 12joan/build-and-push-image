name: 'Build and push image'

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: '.'
      file:
        type: string
        required: false
      labels:
        type: string
        required: false
    secrets:
      github-token:
        required: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: 'Build for ${{ matrix.platform }}'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            output: linux_amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            output: linux_arm64
    outputs:
      linux_amd64: ${{ steps.outputs.outputs.linux_amd64 }}
      linux_arm64: ${{ steps.outputs.outputs.linux_arm64 }}

    steps:
      - name: 'Log in to registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: 'Extract metadata'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build and push source image'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          outputs: 'type=image,"name=${{ env.IMAGE_NAME }}",oci-artifact=true,push-by-digest=true,name-canonical=true,push=true'
          labels: ${{ inputs.labels || steps.metadata.outputs.labels }}
          platforms: ${{ matrix.platform }}

      - name: 'Output image source'
        id: outputs
        run: echo "$OUTPUT_NAME=$IMAGE_SOURCE" >> "$GITHUB_OUTPUT"
        env:
          OUTPUT_NAME: ${{ matrix.output }}
          IMAGE_SOURCE: ${{ env.IMAGE_NAME }}:${{ steps.build.outputs.digest }}

  combine:
    name: 'Combine and push images'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: 'Log in to registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: 'Extract metadata'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build and push combined image'
        run: |
          TAG_OPTIONS="-t $(echo $TAGS | sed 's/,/ -t /g')"
          docker buildx imagetools create $TAG_OPTIONS $SOURCE_IMAGES
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          SOURCE_IMAGES: |
            ${{ needs.build.outputs.linux_amd64 }}
            ${{ needs.build.outputs.linux_arm64 }}
